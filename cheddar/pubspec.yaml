name: cheddar
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  cloud_firestore: ^6.7.1
  google_sign_in: ^6.2.1
  string_to_icon: ^1.0.0
  flutter_iconpicker: ^4.0.3

  flutter:
    sdk: flutter

  fl_chart: ^0.63.0
  auto_size_text: ^3.0.0
  provider: ^6.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1 

flutter_launcher_icons:
  image_path: "assets/cheddarIcon.png"
  
  ios: true

  remove_alpha_ios: true
  
  adaptive_icon_background: "#FFFFFF" 
  adaptive_icon_foreground: "assets/cheddarIcon.png"
  

flutter:
  uses-material-design: true
